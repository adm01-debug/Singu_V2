# db-guards.yml — Rodada 26/10
# Regras de alerta consumindo metricas do full-audit-exporter.sh
groups:
  - name: db-guards-fatal
    interval: 30s
    rules:
      - alert: DBGuardFatal
        expr: guard_status{severity="fatal"} == 2
        for: 1m
        labels:
          severity: page
          team: db-ops
        annotations:
          summary: "FATAL guard {{ $labels.name }} disparou"
          description: "Guard FATAL '{{ $labels.name }}' esta em estado 2 (fatal) ha >=1min. Ver runbook."
          runbook_url: "https://github.com/lovable/repo/blob/main/docs/runbooks/db-guards.md#{{ $labels.name }}"

      - alert: DBGuardWarn
        expr: guard_status{severity="warn"} == 1
        for: 15m
        labels:
          severity: ticket
          team: db-ops
        annotations:
          summary: "WARN guard {{ $labels.name }} persistente"
          description: "Guard WARN '{{ $labels.name }}' em estado 1 ha >=15min. Investigar."
          runbook_url: "https://github.com/lovable/repo/blob/main/docs/runbooks/db-guards.md#warn-generico"

  - name: db-guards-liveness
    interval: 30s
    rules:
      - alert: DBGuardDeadMan
        expr: (time() - guard_last_run_timestamp_seconds) > 7200
        for: 5m
        labels:
          severity: page
          team: db-ops
        annotations:
          summary: "full-audit.sh nao roda ha >2h (dead-man switch)"
          description: "Ultimo run: {{ $value | humanizeDuration }} atras. Cron ou exporter parou."
          runbook_url: "https://github.com/lovable/repo/blob/main/docs/runbooks/db-guards.md#dead-man-switch"

      - alert: DBGuardExporterDown
        expr: absent(guard_exporter_up) == 1
        for: 15m
        labels:
          severity: ticket
          team: db-ops
        annotations:
          summary: "Exporter sem sinal ha >15min"
          description: "Metrica guard_exporter_up ausente. Meta-monitoring."
          runbook_url: "https://github.com/lovable/repo/blob/main/docs/runbooks/db-guards.md#exporter-down"

      - alert: DBGuardFlapping
        expr: changes(guard_status[1h]) > 5
        for: 10m
        labels:
          severity: ticket
          team: db-ops
        annotations:
          summary: "Guard {{ $labels.name }} flapping (>5 flips/h)"
          description: "Suprima temporariamente e investigue causa raiz."
          runbook_url: "https://github.com/lovable/repo/blob/main/docs/runbooks/db-guards.md#flapping"

  - name: db-guards-aggregate
    interval: 1m
    rules:
      # Recording rules para conter cardinalidade em dashboards
      - record: db_guards:count_by_severity
        expr: count by (severity) (guard_status)
      - record: db_guards:fatal_active
        expr: sum(guard_status{severity="fatal"} == 2) or vector(0)
      - record: db_guards:warn_active
        expr: sum(guard_status{severity="warn"} == 1) or vector(0)