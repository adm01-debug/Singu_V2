# alertmanager.yml — Rodada 26/10
global:
  resolve_timeout: 5m

route:
  receiver: default-slack
  group_by: ['alertname', 'team', 'name']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="page"
      receiver: pagerduty-db
      continue: false
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity="ticket"
      receiver: slack-db-ops
      continue: false
    - matchers:
        - maintenance="true"
      receiver: 'null'

receivers:
  - name: 'null'
  - name: default-slack
    slack_configs:
      - channel: '#db-ops'
        api_url: 'https://hooks.slack.com/services/REPLACE_ME'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }} Runbook: {{ .CommonAnnotations.runbook_url }}'
  - name: slack-db-ops
    slack_configs:
      - channel: '#db-ops'
        api_url: 'https://hooks.slack.com/services/REPLACE_ME'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }} Runbook: {{ .CommonAnnotations.runbook_url }}'
  - name: pagerduty-db
    pagerduty_configs:
      - service_key: 'REPLACE_ME_PD_INTEGRATION_KEY'
        severity: 'critical'
        description: '{{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_matchers:
      - alertname="DBGuardFatal"
    target_matchers:
      - alertname="DBGuardWarn"
    equal: ['name']
  - source_matchers:
      - alertname="DBGuardDeadMan"
    target_matchers:
      - alertname=~"DBGuard(Fatal|Warn)"
    equal: ['team']