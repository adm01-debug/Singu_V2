name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate PR Title (Conventional Commits)
        if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "${PR_TITLE}" | npx commitlint

      - name: Check for circular dependencies
        run: npx depcruise src --config .dependency-cruiser.cjs

      - name: Edge Function CORS scoped enforces
        run: node scripts/check-edge-cors.mjs

      - name: Edge Function import guard
        run: npm run check:edge-imports

      - name: Validar falhas de coleta nos gates de RLS e publicaÃ§Ã£o
        run: node --test scripts/check-publish-gates.test.mjs scripts/check-rls-profiles.test.mjs scripts/check-deploy-timeout.test.mjs

      - name: Preparar Deno para os testes das funcÃ§Ãµes
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Testar isolamento e proteÃ§Ã£o SSRF das conexÃµes
        run: deno test --node-modules-dir=none --allow-net --allow-run --allow-env=HOME supabase/functions/_shared/safe-http_test.ts supabase/functions/connection-tester/index_test.ts supabase/functions/_shared/validation-contract_test.ts supabase/functions/_shared/behavioral-retry-contract_test.ts

      - name: Verificar tipos de todas as Edge FuncÃ§Ãµes
        run: deno check --no-lock --node-modules-dir=none supabase/functions/*/index.ts

      - name: Validar contratos de tipos, webhook e SDK
        run: deno test --no-lock --node-modules-dir=none --allow-net=127.0.0.1,0.0.0.0 --allow-run --allow-env=HOME,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY supabase/functions/_shared/edge-types-contract_test.ts supabase/functions/_shared/evolution-dispatch-contract_test.ts supabase/functions/_shared/sdk-runtime-contract_test.ts

      - name: Validar projecÃ§Ãµes e isolamento tenant
        run: deno test --node-modules-dir=none supabase/functions/_shared/select-projection_test.ts supabase/functions/_shared/tenant-guard_test.ts

      - name: Validar JWT nas escritas e conflitos de concorrÃªncia
        run: deno test --no-lock --node-modules-dir=none --allow-net=127.0.0.1,0.0.0.0 --allow-run --allow-env=HOME supabase/functions/external-data/actor-writes_test.ts supabase/functions/_shared/suppress-notification_test.ts supabase/functions/_shared/write-error_test.ts

      - name: Verificar tipos do gateway de dados
        run: deno check --node-modules-dir=none supabase/functions/external-data/index.ts

      - name: Validar confirmaÃ§Ã£o e isolamento das sequÃªncias
        run: deno test --no-lock --node-modules-dir=none --allow-net=127.0.0.1 --allow-run --allow-env=HOME supabase/functions/_shared/sequence-contract_test.ts

      - name: Verificar tipos do processador de sequÃªncias
        run: deno check --no-lock --node-modules-dir=none supabase/functions/sequence-processor/index.ts

      - name: Validate required test secrets
        if: ${{ github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          RLS_USER_A: ${{ secrets.RLS_USER_A }}
          RLS_USER_B: ${{ secrets.RLS_USER_B }}
          RLS_USER_ADMIN: ${{ secrets.RLS_USER_ADMIN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          missing=0
          for name in PGHOST PGUSER PGPASSWORD PGDATABASE RLS_USER_A RLS_USER_B RLS_USER_ADMIN VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY TEST_USER_EMAIL TEST_USER_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret obrigatÃ³rio ausente: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Invalid indexes guard (public.*)
        if: ${{ github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
