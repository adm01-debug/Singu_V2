name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate PR Title (Conventional Commits)
        if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

      - name: Check for circular dependencies
        run: npx depcruise src --config .dependency-cruiser.cjs

      - name: Edge Function CORS scoped enforcer
        run: node scripts/check-edge-cors.mjs

      - name: Edge Function import guard
        run: npm run check:edge-imports

      - name: Preparar Deno para os testes das funções
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Testar isolamento e proteção SSRF das conexões
        run: deno test --node-modules-dir=none --allow-net --allow-run --allow-env=HOME supabase/functions/_shared/safe-http_test.ts supabase/functions/connection-tester/index_test.ts supabase/functions/_shared/validation-contract_test.ts supabase/functions/_shared/behavioral-retry-contract_test.ts

      - name: Verificar tipos da função de conexões
        run: deno check --node-modules-dir=none supabase/functions/connection-tester/index.ts supabase/functions/email-verifier/index.ts supabase/functions/phone-validator/index.ts supabase/functions/validation-queue-worker/index.ts supabase/functions/process-behavioral-regen-queue/index.ts supabase/functions/generate-behavioral-profile/index.ts supabase/functions/retry-behavioral-profile/index.ts supabase/functions/auto-regen-behavioral-profiles/index.ts supabase/functions/auto-rebatch-behavioral/index.ts

      - name: Validar projeções e isolamento tenant
        run: deno test --node-modules-dir=none supabase/functions/_shared/select-projection_test.ts supabase/functions/_shared/tenant-guard_test.ts

      - name: Verificar tipos do gateway de dados
        run: deno check --node-modules-dir=none supabase/functions/external-data/index.ts

      - name: Validar confirmação e isolamento das sequências
        run: deno test --no-lock --node-modules-dir=none --allow-net=127.0.0.1 --allow-run --allow-env=HOME supabase/functions/_shared/sequence-contract_test.ts

      - name: Verificar tipos do processador de sequências
        run: deno check --no-lock --node-modules-dir=none supabase/functions/sequence-processor/index.ts

      - name: Validate required test secrets
        if: ${{ github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          RLS_USER_A: ${{ secrets.RLS_USER_A }}
          RLS_USER_B: ${{ secrets.RLS_USER_B }}
          RLS_USER_ADMIN: ${{ secrets.RLS_USER_ADMIN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          missing=0
          for name in PGHOST PGUSER PGPASSWORD PGDATABASE RLS_USER_A RLS_USER_B RLS_USER_ADMIN VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY TEST_USER_EMAIL TEST_USER_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret obrigatório ausente: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Invalid indexes guard (public.*)
        if: ${{ github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
        run: psql -v ON_ERROR_STOP=1 -f scripts/migration/verify/invalid-indexes-guard.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint)
        # Rodada 31/10 — Onda E ratchet GLOBAL:
        # Todo o repo travado em 0/0 (src + supabase/functions + scripts + specs).
        # Novas violações devem vir com `eslint-disable-next-line <regra> -- <motivo>`
        # (ver docs/adr/ADR-020-zero-warning-ratchet.md e ADR-021-onda-e-external-ratchet.md).
        run: |
          npx eslint src --max-warnings=0
          npx eslint supabase/functions --max-warnings=0
          npx eslint scripts --max-warnings=0
          npx eslint . --max-warnings=0

      - name: Security audit (high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install Playwright Browsers
        if: ${{ github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]') }}
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        if: ${{ github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]') }}
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          E2E_USER_PASS: ${{ secrets.TEST_USER_PASSWORD }}
          CI: true

      - name: Upload Playwright report and artifacts
        uses: actions/upload-artifact@v7
        if: ${{ always() && (github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]')) }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn


      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Run RLS matrix tests (anon / user_a / user_b / user_admin)
        if: ${{ github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          RLS_USER_A: ${{ secrets.RLS_USER_A }}
          RLS_USER_B: ${{ secrets.RLS_USER_B }}
          RLS_USER_ADMIN: ${{ secrets.RLS_USER_ADMIN }}
        run: bash tests/rls/run.sh

      - name: RLS coverage (public.* tables must have RLS + policy)
        if: ${{ github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
        run: psql -v ON_ERROR_STOP=1 -f scripts/migration/verify/rls-coverage.sql

      - name: Check bundle size budget
        run: node scripts/check-bundle-size.mjs

      - name: Lighthouse CI (performance budgets)
        if: ${{ github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, '[bot]') }}
        run: npx --yes @lhci/cli@0.13.x autorun
