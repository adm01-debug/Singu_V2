name: diag-db (temporário, somente leitura)
on:
  push:
    branches: ['chore/hermes-*-diag-db']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: postgres.pgxfvjmuubtbowutlide
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGPORT: '5432'
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Diagnóstico
        run: |
          q() { echo "### $1"; psql -X -P pager=off -c "$1" || true; }
          q "select t.tgname, t.tgfoid::regproc::text fn, pg_get_triggerdef(t.oid) from pg_trigger t where t.tgrelid in ('public.competitors'::regclass, 'public.interactions'::regclass) and not t.tgisinternal order by 1"
          q "select table_name, column_name, data_type, is_nullable from information_schema.columns where table_schema='public' and table_name in ('competitors','interactions_audit') order by 1, ordinal_position"
          q "select p.oid::regproc::text, pg_get_functiondef(p.oid) from pg_proc p join pg_trigger t on t.tgfoid=p.oid where t.tgrelid in ('public.competitors'::regclass) and not t.tgisinternal union select p.oid::regproc::text, pg_get_functiondef(p.oid) from pg_proc p where p.prosrc ilike '%interactions_audit%'"
          q "select count(*) total, count(*) filter (where contact_id is null) sem_contato, max(updated_at) ultimo_update from public.interactions"
          q "select count(*), max(updated_at) from public.competitors"
