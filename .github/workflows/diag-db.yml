name: diag-db (temporário, somente leitura)
on:
  push:
    branches: ['chore/hermes-*-diag-db']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: postgres.pgxfvjmuubtbowutlide
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGPORT: '5432'
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Diagnóstico
        run: |
          q() { echo "### $1"; psql -X -P pager=off -c "$1" || true; }
          q "select conname, convalidated, pg_get_constraintdef(oid) from pg_constraint where conrelid='public.contacts'::regclass and contype='c'"
          q "select relationship_stage, count(*) from public.contacts group by 1 order by 2 desc"
          q "select pg_get_functiondef('public.calculate_relationship_metrics_internal'::regproc)"
          q "select c.relname, t.tgname, t.tgtype from pg_trigger t join pg_class c on c.oid=t.tgrelid where t.tgfoid='public.calculate_relationship_metrics'::regproc"
          echo "### verify (transação revertida)"
          psql -X -P pager=off -f diag/verify.sql 2>&1 | grep -vE "collation|DETAIL|HINT" || true
          echo "### varredura de gatilhos de UPDATE (transação revertida)"
          psql -X -P pager=off -f diag/scan.sql 2>&1 | grep -E "FALHA|RESUMO|ERROR|ROLLBACK"
