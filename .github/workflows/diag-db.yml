name: diag-db (temporário, somente leitura)
on:
  push:
    branches: ['chore/hermes-*-diag-db']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: postgres.pgxfvjmuubtbowutlide
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGPORT: '5432'
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Diagnóstico
        run: |
          q() { echo "### $1"; psql -X -P pager=off -c "$1" || true; }
          q "select table_name, column_name, is_nullable from information_schema.columns where table_schema='public' and ((table_name='interactions' and column_name in ('user_id','contact_id')) or (table_name in ('audit_log','interactions_audit') and column_name='user_id'))"
          q "select count(*) filter (where user_id is null) interacoes_sem_user from public.interactions"
          echo "### varredura de gatilhos de UPDATE (transação revertida)"
          psql -X -P pager=off -f diag/scan.sql 2>&1 | grep -E "FALHA|RESUMO|ERROR|ROLLBACK"
