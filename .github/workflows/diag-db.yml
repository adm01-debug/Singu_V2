name: diag-db (temporário, somente leitura)
on:
  push:
    branches: ['chore/hermes-*-diag-db']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: postgres.pgxfvjmuubtbowutlide
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGPORT: '5432'
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Diagnóstico
        run: |
          q() { echo "### $1"; psql -X -P pager=off -c "$1" || true; }
          q "select pg_get_functiondef(p.oid) from pg_proc p where proname in ('calculate_relationship_metrics_internal','log_activity')"
          q "select tgname, pg_get_triggerdef(t.oid) from pg_trigger t where tgrelid='public.interactions'::regclass and tgname in ('tr_update_contact_metrics','tr_update_relationship_metrics','trg_log_interaction_activity','on_interaction_created')"
