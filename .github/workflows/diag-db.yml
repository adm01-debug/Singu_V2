name: diag-db (temporário, somente leitura)
on:
  push:
    branches: ['chore/hermes-*-diag-db']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: postgres.pgxfvjmuubtbowutlide
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGPORT: '5432'
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Diagnóstico
        run: |
          q() { echo "### $1"; psql -X -P pager=off -c "$1" || true; }
          q "select c.relname, t.tgname from pg_trigger t join pg_class c on c.oid=t.tgrelid where not t.tgisinternal and t.tgfoid='public.audit_trigger_fn'::regproc order by 1"
          q "select pg_get_function_identity_arguments(p.oid) args, p.prosecdef, array_to_string(p.proacl, ',') acl from pg_proc p where p.oid in ('public.audit_trigger_fn'::regproc, 'public.log_contact_tag_changes'::regproc)"
          echo "### correção aplicada em transação revertida"
          psql -X -P pager=off -f diag/verify.sql
