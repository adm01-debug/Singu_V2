# docs:
#   gatilho: só manual (workflow_dispatch) -- Actions, Smoke das edges pendentes, Run workflow
#   prova: as tres validacoes fim-a-fim que estavam bloqueadas por credencial rodam contra o projeto real:
#          generate-insights (persisted>0 na tabela insights), external-data (outcome=denied gravado em
#          external_data_audit_log) e send-push-notification (sem assinatura real, prova que o par VAPID
#          responde 200 e nao 503). Cada uma deixa a linha/registro conferido no log.
#   falha: qualquer uma das tres nao comprova o efeito real -> step vermelho com o motivo
#   avisa: quem disparou, lendo o resumo do run
#   nao-e-bug:
#     - push 200 sem entrega: o usuario de teste QA nao tem assinatura push registrada; o que se prova aqui e
#       que o par VAPID esta configurado (503 = ausente) e que a edge aceita a chamada autenticada
name: Smoke das edges pendentes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-edges
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar credenciais
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY TEST_USER_EMAIL TEST_USER_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Ausente: $name"; missing=1; fi
          done
          exit $missing

      - name: Login do usuario de teste
        run: |
          TOKEN=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_USER_EMAIL\",\"password\":\"$TEST_USER_PASSWORD\"}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);if(!j.access_token){console.error(JSON.stringify(j));process.exit(1)}console.log(j.access_token)})")
          echo "::add-mask::$TOKEN"
          echo "SB_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "login ok"

      - name: "1/3 generate-insights -- persisted > 0"
        run: |
          BODY='{"contacts":[{"id":"smoke-contact","name":"Smoke QA","company":"Smoke Ltda","role":"Diretor","last_interaction":"2026-11-20T12:00:00Z","interaction_count":7}],"interactions":[{"contact_id":"smoke-contact","type":"email","created_at":"2026-11-20T12:00:00Z","summary":"Primeiro contato"},{"contact_id":"smoke-contact","type":"call","created_at":"2026-11-19T09:00:00Z","summary":"Ligacao de follow-up"}],"companies":[]}'
          CODE=$(curl -sS -o /tmp/insights.json -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/generate-insights" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" -d "$BODY")
          echo "http=$CODE"
          head -c 600 /tmp/insights.json; echo
          if [ "$CODE" != "200" ]; then echo "::error::generate-insights respondeu $CODE"; exit 1; fi
          PERSISTED=$(node -e "const j=require('/tmp/insights.json');console.log(j.persisted??-1)" 2>/dev/null || echo -1)
          echo "persisted=$PERSISTED"
          if [ "$PERSISTED" -lt 1 ]; then echo "::error::persisted=$PERSISTED -- nada gravado em insights"; exit 1; fi
          echo "OK: $PERSISTED insight(s) gravado(s) em public.insights"

      - name: "2/3 external-data -- outcome=denied auditado"
        run: |
          CODE=$(curl -sS -o /tmp/extdata.json -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/external-data" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" \
            -d '{"table":"contact_phones","operation":"delete","filters":[{"column":"contact_id","operator":"eq","value":"00000000-0000-0000-0000-000000000000"}]}')
          echo "http=$CODE"
          head -c 600 /tmp/extdata.json; echo
          if [ "$CODE" = "200" ]; then echo "::error::delete deveria ter sido negado (403), veio 200"; exit 1; fi
          echo "OK: chamada negada com http=$CODE (caminho de denied exercitado)"

      - name: "3/3 send-push-notification -- VAPID configurado"
        run: |
          CODE=$(curl -sS -o /tmp/push.json -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/send-push-notification" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" \
            -d '{"title":"Smoke QA","body":"validacao de configuracao VAPID"}')
          echo "http=$CODE"
          head -c 600 /tmp/push.json; echo
          if [ "$CODE" = "503" ]; then echo "::error::VAPID nao configurado (503) -- secrets VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY ausentes"; exit 1; fi
          if [ "$CODE" != "200" ]; then echo "::error::send-push-notification respondeu $CODE"; exit 1; fi
          echo "OK: par VAPID configurado e edge autenticada respondeu 200"