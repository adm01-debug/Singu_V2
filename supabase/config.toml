# verify_jwt e declarado por funcao aqui: esta e a fonte unica lida por
# `supabase functions deploy` (o deploy nao passa --no-verify-jwt por flag).
# As funcoes abaixo sao publicas por design — webhooks, crons e proxies externas que nao
# apresentam JWT do Supabase e autenticam por conta propria (token, assinatura ou IP).
# Evidencia medida em 2026-11-23 (run 45265513833): com apenas a anon key no header
# `apikey` e nenhum `Authorization`, a requisicao alcanca o handler nestas funcoes;
# nas demais o gateway responde 401 {"code":401,"message":"Missing authorization header"}.
# A lista coincide com NO_JWT_FUNCTIONS de scripts/migration/functions/deploy-all.sh.

